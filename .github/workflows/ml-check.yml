name: ML pipeline check
on:
  workflow_dispatch:
  push:
    paths:
      - "ml/**"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ml/requirements.txt
      - run: python -m py_compile ml/train_classifier.py
